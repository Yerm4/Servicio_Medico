<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diccionario de Datos - Servicio Médico</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <!-- svg-pan-zoom -->
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            themeVariables: {
                background: '#1e293b',
                primaryColor: '#6366f1',
                primaryTextColor: '#fff',
                lineColor: '#cbd5e1',
                secondaryColor: '#3b82f6',
                tertiaryColor: '#0f172a'
            }
        });
    </script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #0f172a;
            --accent-primary: #6366f1;
            --accent-secondary: #06b6d4;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary), #1e1b4b);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(to right, #a5b4fc, #818cf8, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            padding: 16px 24px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 12px 16px 12px 40px;
            border-radius: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 36px;
            top: 29px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .table-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 24px 16px;
        }

        .table-list::-webkit-scrollbar {
            width: 6px;
        }

        .table-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .table-item {
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
        }

        .table-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .table-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
            color: #fff;
            font-weight: 600;
        }

        .table-item-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .table-item-name i {
            color: var(--text-muted);
        }

        .table-item.active .table-item-name i {
            color: var(--accent-primary);
        }

        .col-count {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 20px;
            color: var(--text-muted);
        }

        .table-item.active .col-count {
            background: var(--accent-primary);
            color: #fff;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .top-navbar {
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 9;
        }

        .tab-navigation {
            display: flex;
            gap: 12px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
        }

        .tab-btn.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        .content-body {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .content-body::-webkit-scrollbar {
            width: 8px;
        }

        .content-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        /* Grid Overview */
        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            animation: fadeIn 0.4s ease;
        }

        .table-card {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
        }

        .table-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 12px 20px -8px rgba(99, 102, 241, 0.3);
        }

        .table-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .table-card-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-card-title i {
            color: var(--accent-primary);
        }

        .col-list-preview {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .col-preview-item {
            display: flex;
            justify-content: space-between;
        }

        .col-preview-name {
            color: #e2e8f0;
        }

        /* Detail View */
        .detail-view {
            max-width: 1000px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        .detail-header {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .detail-title {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .detail-title i {
            color: var(--accent-primary);
        }

        .relations-badge {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-secondary);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .data-table-container {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            margin-bottom: 30px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th {
            background: rgba(15, 23, 42, 0.4);
            padding: 16px 24px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .data-table td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
            color: #e2e8f0;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .col-name-cell {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-pk {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-yellow);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge-fk {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .type-cell {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-secondary);
            font-size: 14px;
        }

        .nullable-cell i {
            font-size: 16px;
        }

        .nullable-yes {
            color: var(--accent-green);
        }

        .nullable-no {
            color: rgba(239, 68, 68, 0.5);
        }

        .default-cell {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Relations section */
        .relations-section {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--glass-shadow);
        }

        .relations-section h3 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .relations-section h3 i {
            color: var(--accent-secondary);
        }

        .relation-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .relation-item:last-child {
            margin-bottom: 0;
        }

        .relation-icon {
            color: var(--accent-secondary);
            font-size: 16px;
        }

        .relation-arrow {
            color: var(--text-muted);
        }

        .relation-code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }

        /* Diagram View */
        .diagram-view {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--glass-shadow);
            overflow: auto;
            text-align: center;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.4s ease;
        }

        .diagram-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            align-self: flex-start;
            color: #fff;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            color: var(--accent-primary);
            margin-bottom: 16px;
        }

        .empty-state h2 {
            color: #fff;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-title">
                <i class="fa-solid fa-database"></i>
                Servicio Médico
            </h1>
        </div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search" class="search-input" placeholder="Buscar tablas o columnas...">
        </div>
        <div class="table-list" id="tableList">
            <!-- Table list items dynamically generated -->
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-navbar">
            <div class="tab-navigation">
                <button class="tab-btn active" onclick="switchTab('all')">
                    <i class="fa-solid fa-table-cells"></i>

                </button>
                <button class="tab-btn" onclick="switchTab('diagram')">
                    <i class="fa-solid fa-diagram-project"></i>

            </div>
            <div class="project-info" style="font-size: 13px; color: var(--text-muted);">
                <i class="fa-solid fa-circle-info"></i> Generado desde servicio_medico.sql
            </div>
        </div>

        <div class="content-body" id="contentBody">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Data Injection -->

    {

            {

            {

        let currentTab = 'all'; // 'all', 'detail', 'diagram'
        let selectedTableName = null;

        function init() {
            renderSidebar();
            renderContent();
            
            document.getElementById('search').addEventListener('input', () => {
                renderSidebar();
            });
        }

        function renderSidebar() {
            const query = document.getElementById('search').value.toLowerCase();
            const listEl = document.getElementById('tableList');
            listEl.innerHTML = '';
            
            database.forEach(table => {
                const colMatch = table.columns.some(col => col.name.toLowerCase().includes(query));
                const nameMatch = table.name.toLowerCase().includes(query);
                
                if (query === '' || nameMatch || colMatch) {
                    const isActive = selectedTableName === table.name && currentTab === 'detail';
                    
                    const item = document.createElement('div');
                    item.className = `table-item ${isActive ? 'active' : ''}`;
                    item.onclick = () => showTableDetail(table.name);
                    
                    item.innerHTML = `
                        <div class="table-item-name">
                            <i class="fa-solid fa-table"></i>
                            ${table.name}
                        </div>
                        <span class="col-count">${table.columns.length}</span>
                    `;
                    listEl.appendChild(item);
                }
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            if (tab !== 'detail') {
                selectedTableName = null;
            }
            
            const buttons = document.querySelectorAll('.tab-btn');
            buttons[0].classList.toggle('active', tab === 'all');
            buttons[1].classList.toggle('active', tab === 'diagram');
            
            renderSidebar();
            renderContent();
        }

        function showTableDetail(tableName) {
            selectedTableName = tableName;
            currentTab = 'detail';
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            renderSidebar();
            renderContent();
        }

        function renderContent() {
            const body = document.getElementById('contentBody');
            body.innerHTML = '';
            
            if (currentTab === 'all') {
                renderGridView(body);
            } else if (currentTab === 'detail') {
                renderDetailView(body);
            } else if (currentTab === 'diagram') {
                renderDiagramView(body);
            }
        }

        function renderGridView(container) {
            const grid = document.createElement('div');
            grid.className = 'grid-overview';
            
            database.forEach(table => {
                const card = document.createElement('div');
                card.className = 'table-card';
                card.onclick = () => showTableDetail(table.name);
                
                let otherHtml = '';
                
                table.columns.forEach((col, idx) => {
                    const pkBadge = col.primary_key ? '<span class="badge badge-pk" style="font-size: 8px;">PK</span>' : '';
                    const isFk = table.foreign_keys.some(fk => fk.column === col.name);
                    const fkBadge = isFk ? '<span class="badge badge-fk" style="font-size: 8px;">FK</span>' : '';
                    
                    const line = `
                        <div class="col-preview-item">
                            <span class="col-preview-name">${col.name} ${pkBadge}${fkBadge}</span>
                            <span>${col.type}</span>
                        </div>
                    `;
                    
                    if (idx < 6) {
                        otherHtml += line;
                    }
                });
                
                if (table.columns.length > 6) {
                    otherHtml += `<div style="text-align: center; color: var(--text-muted); font-size: 11px; margin-top: 6px;">+ \${table.columns.length - 6} más...</div>`;
                }
                
                card.innerHTML = `
                    <div class="table-card-header">
                        <div class="table-card-title">
                            <i class="fa-solid fa-table"></i>
                            ${table.name}
                        </div>
                        <span class="col-count">${table.columns.length} cols</span>
                    </div>
                    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; flex-grow: 1;">
                        ${table.description || 'Sin descripción.'}
                    </div>
                    <div class="col-list-preview">
                        ${otherHtml}
                    </div>
                `;
                grid.appendChild(card);
            });
            
            container.appendChild(grid);
        }

        function renderDetailView(container) {
            const table = database.find(t => t.name === selectedTableName);
            if (!table) return;
            
            const detail = document.createElement('div');
            detail.className = 'detail-view';
            
            let rowsHtml = '';
            table.columns.forEach(col => {
                const pkBadge = col.primary_key ? '<span class="badge badge-pk">PK</span>' : '';
                const fkInfo = table.foreign_keys.find(fk => fk.column === col.name);
                const fkBadge = fkInfo ? `<span class="badge badge-fk" title="Ref: \${fkInfo.ref_table}(\${fkInfo.ref_column})">FK</span>` : '';
                
                const nullableIcon = col.nullable 
                    ? '<i class="fa-solid fa-check nullable-yes"></i>' 
                    : '<i class="fa-solid fa-xmark nullable-no"></i>';
                    
                rowsHtml += `
                    <tr>
                        <td class="col-name-cell">
                            ${col.name}
                            ${pkBadge}
                            ${fkBadge}
                        </td>
                        <td class="type-cell">${col.type}</td>
                        <td class="nullable-cell" style="text-align: center;">${nullableIcon}</td>
                        <td class="default-cell">${col.default !== null ? col.default : '<span style="color: rgba(255,255,255,0.15)">NULL</span>'}</td>
                        <td style="font-size: 14px; color: var(--text-muted); line-height: 1.4;">${col.description || 'Sin descripción.'}</td>
                    </tr>
                `;
            });
            
            let relationsHtml = '';
            if (table.foreign_keys.length > 0) {
                let itemsHtml = '';
                table.foreign_keys.forEach(fk => {
                    itemsHtml += `
                        <div class="relation-item">
                            <i class="fa-solid fa-link relation-icon"></i>
                            Columna <span class="relation-code">${fk.column}</span>
                            <span class="relation-arrow">&rarr;</span>
                            Referencia a <span class="relation-code">${fk.ref_table}(\&nbsp;${fk.ref_column}\&nbsp;)</span>
                        </div>
                    `;
                });
                relationsHtml = `
                    <div class="relations-section">
                        <h3><i class="fa-solid fa-network-wired"></i> Relaciones / Llaves Foráneas</h3>
                        ${itemsHtml}
                    </div>
                `;
            }
